        ...globalRoot.querySelectorAll(&quot;[data-jd-mobile-search-open]&quot;),

      const mobileSearchInput = globalRoot.querySelector(&quot;[data-jd-mobile-search-input]&quot;);

      const mobileViews = [...globalRoot.querySelectorAll(&quot;[data-jd-mobile-view]&quot;)];
      const mobilePageButtons = [...globalRoot.querySelectorAll(&quot;[data-jd-mobile-page]&quot;)];
      const mobileQuickSearch = mobileSearchOpenButtons.find((button) =&gt;
        button.classList.contains(&quot;jd-mobile-quick-button&quot;)
      );
      const mobileMenuButton = mobileMenuButtons[0];
      const mobileTabsButton = globalRoot.querySelector(&quot;[data-jd-mobile-tabs]&quot;);
      const mobileNativeMenuButton = globalRoot.querySelector(&quot;[data-jd-mobile-native-menu]&quot;);
      const mobileTabsPanel = globalRoot.querySelector(&quot;[data-jd-mobile-tabs-panel]&quot;);
      const mobileNativePanel = globalRoot.querySelector(&quot;[data-jd-mobile-native-panel]&quot;);
      const mobileChromePanels = [mobileTabsPanel, mobileNativePanel];
      const desktopRoot = globalRoot.querySelector(&#x27;[data-jd-panel=&quot;desktop&quot;]&#x27;);
      const desktopPages = [...desktopRoot.querySelectorAll(&quot;[data-jd-page]&quot;)];
      const desktopNavButtons = [...desktopRoot.querySelectorAll(&quot;[data-jd-nav]&quot;)];
      const desktopTitle = desktopRoot.querySelector(&quot;.jd-page-title h1&quot;);
      const desktopSubtitle = desktopRoot.querySelector(&quot;.jd-page-title span&quot;);
      const desktopTabMeta = desktopRoot.querySelector(&quot;.jd-tab-strip &gt; span:last-child&quot;);
      const desktopPageCopy = {
        journal: [&quot;今天&quot;, &quot;11 月 14 日 · 周六 · 农历十月初六&quot;, &quot;今天 · 11 月 14 日&quot;],
        content: [&quot;内容&quot;, &quot;按时间回望写下的内容&quot;, &quot;内容&quot;],
        checkin: [&quot;目标与打卡&quot;, &quot;今天完成 1 / 3 项 · 点击树节点管理归属&quot;, &quot;打卡&quot;],
        search: [&quot;搜索&quot;, &quot;搜索日记、书籍、长文和标签&quot;, &quot;搜索&quot;],
      };

      function setDevice(device) {
        deviceTabs.forEach((tab) =&gt; {
          const active = tab.dataset.jdDevice === device;
          tab.classList.toggle(&quot;is-active&quot;, active);
          tab.setAttribute(&quot;aria-selected&quot;, String(active));
        });
        panels.forEach((panel) =&gt; {
          panel.hidden = panel.dataset.jdPanel !== device;
        });
      }

      deviceTabs.forEach((tab) =&gt; {
        tab.addEventListener(&quot;click&quot;, () =&gt; setDevice(tab.dataset.jdDevice));
      });

      function setDesktopPage(page, focusSearch = false) {
        desktopPages.forEach((panel) =&gt; {
          panel.hidden = panel.dataset.jdPage !== page;
        });
        desktopNavButtons.forEach((button) =&gt; {
          const active = button.dataset.jdNav === page;
          button.classList.toggle(&quot;is-active&quot;, active);
          if (active) {
            button.setAttribute(&quot;aria-current&quot;, &quot;page&quot;);
          } else {
            button.removeAttribute(&quot;aria-current&quot;);
          }
        });
        const copy = desktopPageCopy[page] || desktopPageCopy.journal;
        desktopTitle.textContent = copy[0];
        desktopSubtitle.textContent = copy[1];
        desktopTabMeta.textContent = copy[2];
        if (page === &quot;search&quot; &amp;&amp; focusSearch) {
          window.setTimeout(
            () =&gt; desktopRoot.querySelector(&#x27;[data-jd-page=&quot;search&quot;] input&#x27;)?.focus(),
            0
          );
        }
      }

      function setMobilePage(page) {
        if (page === &quot;search&quot;) {
          setMobileSearch(true);
          return;
        }
        mobileViews.forEach((view) =&gt; {
          view.hidden = view.dataset.jdMobileView !== page;
        });
        mobilePageButtons.forEach((button) =&gt; {
          const active = button.dataset.jdMobilePage === page;
          button.classList.toggle(&quot;is-active&quot;, active);
          if (active) {
            button.setAttribute(&quot;aria-current&quot;, &quot;page&quot;);
          } else {
            button.removeAttribute(&quot;aria-current&quot;);
          }
        });
        if (page === &quot;checkin&quot;) {
          mobileTitle.textContent = &quot;目标与打卡&quot;;
          mobileSubtitle.textContent = &quot;OKR · 今日打卡&quot;;
        } else if (page === &quot;content&quot;) {
          mobileTitle.textContent = &quot;内容&quot;;
          mobileSubtitle.textContent = &quot;长文与引用关系&quot;;
        } else {
          const date = new Date(`${selectedDateKey}T12:00:00`);
          const isToday = selectedDateKey === todayKey;
          mobileTitle.textContent = isToday
            ? &quot;今天&quot;
            : `${date.getMonth() + 1} 月 ${date.getDate()} 日`;
          mobileSubtitle.textContent = `${monthNames[date.getDay()]} · ${
            isToday ? &quot;当下&quot; : selectedDateKey &lt; todayKey ? &quot;曾经&quot; : &quot;未来&quot;
          }`;
        }
        mobileFeed.scrollTop = 0;
      }

      desktopNavButtons.forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; setDesktopPage(button.dataset.jdNav));
      });
      desktopRoot.querySelectorAll(&quot;[data-jd-open-search]&quot;).forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; setDesktopPage(&quot;search&quot;, true));
      });

      globalRoot.querySelector(&quot;[data-jd-collapse-sidebar]&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        shell.classList.add(&quot;is-collapsed&quot;);
      });
      globalRoot.querySelector(&quot;[data-jd-open-sidebar]&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        shell.classList.remove(&quot;is-collapsed&quot;);
      });

      function setMobileQuickActive(view) {
        mobileQuickSearch?.classList.toggle(&quot;is-active&quot;, view === &quot;search&quot;);
        mobileMenuButton?.classList.toggle(&quot;is-active&quot;, view === &quot;menu&quot;);
        mobileTabsButton?.classList.toggle(&quot;is-active&quot;, view === &quot;tabs&quot;);
        mobileNativeMenuButton?.classList.toggle(&quot;is-active&quot;, view === &quot;native&quot;);
      }

      function closeMobileChromePanels() {
        mobileChromePanels.forEach((panel) =&gt; {
          panel.hidden = true;
        });
      }

      function syncMobileScrollLock() {
        const relatedOpen = [...globalRoot.querySelectorAll(&quot;[data-jd-related-panel]&quot;)].some(
          (panel) =&gt; !panel.hidden
        );
        const locked =
          mobileDrawer.classList.contains(&quot;is-open&quot;) ||
          mobileSearchLayer.classList.contains(&quot;is-open&quot;) ||
          relatedOpen ||
          mobileChromePanels.some((panel) =&gt; !panel.hidden);
        mobileFeed.classList.toggle(&quot;is-scroll-locked&quot;, locked);
      }

      function setMobileMenu(open) {
        if (open) setMobileSearch(false);
        mobileDrawer.classList.toggle(&quot;is-open&quot;, open);
        mobileDrawer.setAttribute(&quot;aria-hidden&quot;, String(!open));
        mobileBackdrop.hidden = !open;
        mobileMenuButtons.forEach((button) =&gt; {
          button.setAttribute(&quot;aria-expanded&quot;, String(open));
        });
        if (open) {
          closeMobileChromePanels();
          setMobileQuickActive(&quot;menu&quot;);
        } else if (!mobileSearchLayer.classList.contains(&quot;is-open&quot;)) {

      const today = new Date(2026, 10, 14, 12);
      const levels = [0, 1, 2, 1, 3, 0, 2, 4, 1, 2, 0, 3, 2, 1, 4, 2, 3, 0, 1, 2, 4, 3, 1, 2];

      function renderHeatmap(container) {
        const fragment = document.createDocumentFragment();
        const start = new Date(today);
        start.setDate(start.getDate() - 83);
        for (let index = 0; index &lt; 84; index += 1) {
          const date = new Date(start);

          cell.dataset.level = String(level);
          if (index === 83) cell.classList.add(&quot;is-today&quot;);
          const words = level === 0 ? 0 : level * 108 + (index % 9) * 17;
          const entries = level === 0 ? 0 : Math.max(1, Math.ceil(level / 2));
          const label = `${date.getMonth() + 1} 月 ${date.getDate()} 日，${words} 字，${entries} 条记录`;
          cell.setAttribute(&quot;aria-label&quot;, label);

        const dateLabel = `${date.getMonth() + 1} 月 ${date.getDate()} 日 · ${weekday}`;

      function buildMobileCalendar() {
        const year = 2026;
        const monthIndex = 10;
        const daysInMonth = 30;
        const mondayOffset = (new Date(year, monthIndex, 1).getDay() + 6) % 7;
        const cells = [];
        for (let index = 0; index &lt; mondayOffset; index += 1) cells.push(null);
        for (let day = 1; day &lt;= daysInMonth; day += 1) cells.push(day);
        while (cells.length % 7 !== 0) cells.push(null);

        const fragment = document.createDocumentFragment();
        for (let index = 0; index &lt; cells.length; index += 7) {
          const week = document.createElement(&quot;div&quot;);
          week.className = &quot;jd-mobile-week&quot;;
          cells.slice(index, index + 7).forEach((day) =&gt; {
            if (!day) {

              blank.className = &quot;jd-mobile-day is-blank&quot;;
              blank.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
              week.appendChild(blank);

            const key = dateKey(year, monthIndex, day);
            const button = document.createElement(&quot;button&quot;);

      const goalKinds = {

      function getGoal(id) {
        return goalNodes.find((node) =&gt; node.id === id);
      }

      function getGoalChildren(parentId) {
        return goalNodes.filter((node) =&gt; node.parentId === parentId &amp;&amp; !node.archived);
      }

      function getGoalProgress(node) {
        if (node.kind === &quot;task&quot;) return node.done ? 100 : 0;
        if (node.progressMode === &quot;count&quot; &amp;&amp; node.target &gt; 0) {
          return Math.max(0, Math.min(100, Math.round((node.current / node.target) * 100)));
        }
        const children = getGoalChildren(node.id);
        if (!children.length) return Number(node.manualProgress) || 0;
        return Math.round(
          children.reduce((sum, child) =&gt; sum + getGoalProgress(child), 0) / children.length
        );
      }

      function getGoalPath(node) {
        const names = [];
        let current = node;
        while (current) {
          names.unshift(current.title);
          current = current.parentId ? getGoal(current.parentId) : null;
        }
        return names;
      }

      function getGoalDescendantIds(id) {
        const descendants = [];
        const visit = (parentId) =&gt; {
          getGoalChildren(parentId).forEach((child) =&gt; {
            descendants.push(child.id);
            visit(child.id);
          });
        };
        visit(id);
        return descendants;
      }

      function createGoalRowButton(className, label, text) {

      function renderGoalTree(container) {
        const scope = container.dataset.jdGoalTree;
        const fragment = document.createDocumentFragment();

        const appendNode = (node, depth, target) =&gt; {
          const children = getGoalChildren(node.id);
          const progress = getGoalProgress(node);
          const nodeElement = document.createElement(&quot;article&quot;);
          nodeElement.className = &quot;jd-goal-node&quot;;
          nodeElement.dataset.depth = String(depth);
          nodeElement.dataset.jdGoalId = node.id;

          const row = document.createElement(&quot;div&quot;);
          row.className = &quot;jd-goal-node-row&quot;;

          const toggle =
            node.kind === &quot;task&quot;
              ? createGoalRowButton(
                  `jd-goal-task-check${node.done ? &quot; is-done&quot; : &quot;&quot;}`,
                  node.done ? &quot;取消完成&quot; : &quot;标记完成&quot;,
                  node.done ? &quot;✓&quot; : &quot;&quot;
                )
              : createGoalRowButton(
                  `jd-goal-node-toggle${children.length ? &quot;&quot; : &quot; is-empty&quot;}`,
                  node.expanded ? &quot;收起下级&quot; : &quot;展开下级&quot;,
                  children.length ? (node.expanded ? &quot;⌄&quot; : &quot;›&quot;) : &quot;•&quot;
                );

          toggle.addEventListener(&quot;click&quot;, (event) =&gt; {
            event.stopPropagation();
            if (node.kind === &quot;task&quot;) {
              node.done = !node.done;
              renderGoalTrees();
              showGoalStatus(scope, node.done ? `已完成：${node.title}` : `已取消：${node.title}`);
            } else {
              node.expanded = !node.expanded;
              renderGoalTrees();
            }
          });

          const main = document.createElement(&quot;button&quot;);
          main.type = &quot;button&quot;;
          main.className = &quot;jd-goal-node-main&quot;;
          main.setAttribute(&quot;aria-label&quot;, `编辑 ${node.title}`);
          main.addEventListener(&quot;click&quot;, () =&gt; openGoalForm(scope, { mode: &quot;edit&quot;, nodeId: node.id }));

          const title = document.createElement(&quot;strong&quot;);
          title.textContent = node.title;
          const meta = document.createElement(&quot;span&quot;);
          meta.className = &quot;jd-goal-node-meta&quot;;
          const kind = document.createElement(&quot;span&quot;);
          kind.className = &quot;jd-goal-kind&quot;;
          kind.textContent = goalKinds[node.kind] || node.kind;
          const path = document.createElement(&quot;span&quot;);
          path.className = &quot;jd-goal-node-path&quot;;

          path.textContent = parentPath.length ? `属于 ${parentPath.join(&quot; / &quot;)}` : &quot;顶层目标&quot;;
          meta.append(kind, path);
          main.append(title, meta);

          const progressElement = document.createElement(&quot;span&quot;);
          progressElement.className = &quot;jd-goal-node-progress&quot;;
          const progressText = document.createElement(&quot;span&quot;);
          progressText.textContent = node.kind === &quot;task&quot; ? (node.done ? &quot;完成&quot; : &quot;待打卡&quot;) : `${progress}%`;
          const progressTrack = document.createElement(&quot;span&quot;);
          const progressFill = document.createElement(&quot;i&quot;);
          progressFill.style.setProperty(&quot;--goal-progress&quot;, `${progress}%`);
          progressTrack.appendChild(progressFill);
          progressElement.append(progressText, progressTrack);

          const more = createGoalRowButton(&quot;jd-goal-more&quot;, &quot;管理目标&quot;, &quot;⋮&quot;);
          more.setAttribute(&quot;aria-expanded&quot;, &quot;false&quot;);

          const menu = document.createElement(&quot;div&quot;);
          menu.className = &quot;jd-goal-menu&quot;;
          menu.hidden = true;

          const appendMenuAction = (action, label) =&gt; {
            const item = document.createElement(&quot;button&quot;);
            item.type = &quot;button&quot;;
            item.dataset.jdGoalAction = action;
            item.textContent = label;
            item.addEventListener(&quot;click&quot;, () =&gt; {
              menu.hidden = true;
              more.setAttribute(&quot;aria-expanded&quot;, &quot;false&quot;);
              if (action === &quot;add&quot;) openGoalForm(scope, { mode: &quot;create&quot;, parentId: node.id });
              if (action === &quot;edit&quot;) openGoalForm(scope, { mode: &quot;edit&quot;, nodeId: node.id });
              if (action === &quot;move&quot;) openGoalForm(scope, { mode: &quot;move&quot;, nodeId: node.id });
              if (action === &quot;archive&quot;) {
                node.archived = true;
                renderGoalTrees();
                showGoalStatus(scope, `已归档：${node.title}。历史完成记录仍保留。`);
              }
            });
            menu.appendChild(item);
          };

          if (node.kind !== &quot;task&quot;) appendMenuAction(&quot;add&quot;, &quot;添加下级&quot;);
          appendMenuAction(&quot;edit&quot;, &quot;编辑节点&quot;);
          appendMenuAction(&quot;move&quot;, &quot;更改归属&quot;);
          appendMenuAction(&quot;archive&quot;, &quot;归档节点&quot;);

          more.addEventListener(&quot;click&quot;, (event) =&gt; {
            event.stopPropagation();
            const opening = menu.hidden;
            closeGoalMenus();
            menu.hidden = !opening;
            more.setAttribute(&quot;aria-expanded&quot;, String(opening));
          });

          row.append(toggle, main, progressElement, more, menu);
          nodeElement.appendChild(row);

          if (children.length &amp;&amp; node.expanded) {
            const childContainer = document.createElement(&quot;div&quot;);
            childContainer.className = &quot;jd-goal-node-children&quot;;
            nodeElement.appendChild(childContainer);

              .sort((first, second) =&gt; first.title.localeCompare(second.title, &quot;zh-CN&quot;))
              .forEach((child) =&gt; appendNode(child, depth + 1, childContainer));
          }

          target.appendChild(nodeElement);
        };

        goalNodes
          .filter((node) =&gt; node.parentId === null &amp;&amp; !node.archived)
          .sort((first, second) =&gt; first.title.localeCompare(second.title, &quot;zh-CN&quot;))
          .forEach((node) =&gt; appendNode(node, 0, fragment));

        if (!fragment.childNodes.length) {
          const empty = document.createElement(&quot;div&quot;);
          empty.className = &quot;jd-goal-empty&quot;;
          empty.textContent = &quot;还没有目标。先新建一个方向或目标。&quot;;
          fragment.appendChild(empty);
        }
        container.replaceChildren(fragment);
      }

      function updateGoalSummary() {
        const tasks = goalNodes.filter((node) =&gt; node.kind === &quot;task&quot; &amp;&amp; !node.archived);
        const completed = tasks.filter((node) =&gt; node.done).length;

      }

      function inferChildKind(parent) {
        if (!parent) return &quot;objective&quot;;
        if (parent.kind === &quot;objective&quot;) return &quot;key-result&quot;;
        if (parent.kind === &quot;key-result&quot;) return &quot;task&quot;;
        if (parent.kind === &quot;task&quot;) return &quot;stage&quot;;
        return &quot;task&quot;;
      }

      function openGoalForm(scope, config) {
        const host = globalRoot.querySelector(`[data-jd-goal-form-host=&quot;${scope}&quot;]`);
        if (!host) return;
        closeGoalMenus();
        const node = config.nodeId ? getGoal(config.nodeId) : null;
        let parent = config.parentId ? getGoal(config.parentId) : node?.parentId ? getGoal(node.parentId) : null;

        const form = document.createElement(&quot;form&quot;);
        form.className = &quot;jd-goal-form&quot;;
        form.dataset.jdGoalForm = scope;

        const head = document.createElement(&quot;div&quot;);
        head.className = &quot;jd-goal-form-head&quot;;
        const headCopy = document.createElement(&quot;div&quot;);
        const heading = document.createElement(&quot;strong&quot;);
        heading.textContent =
          config.mode === &quot;create&quot;
            ? parent
              ? `在“${parent.title}”下添加下级`
              : &quot;新建顶层目标&quot;
            : config.mode === &quot;move&quot;
              ? &quot;更改归属&quot;
              : &quot;编辑目标节点&quot;;
        const hint = document.createElement(&quot;span&quot;);
        hint.textContent = &quot;标题可用；日期范围留空表示长期有效。父级决定它出现在目标树的哪一层。&quot;;
        headCopy.append(heading, hint);
        const close = createGoalRowButton(&quot;jd-panel-close&quot;, &quot;关闭表单&quot;, &quot;×&quot;);
        close.addEventListener(&quot;click&quot;, () =&gt; host.replaceChildren());
        head.append(headCopy, close);

        const grid = document.createElement(&quot;div&quot;);
        grid.className = &quot;jd-goal-form-grid&quot;;

        const addField = (labelText, control, wide = false) =&gt; {
          const label = document.createElement(&quot;label&quot;);
          if (wide) label.classList.add(&quot;is-wide&quot;);
          label.textContent = labelText;
          label.appendChild(control);
          grid.appendChild(label);
          return control;
        };

        const titleInput = document.createElement(&quot;input&quot;);
        titleInput.type = &quot;text&quot;;
        titleInput.required = true;
        titleInput.value = node?.title || &quot;&quot;;
        titleInput.placeholder = parent ? `例如：在“${parent.title}”下要完成什么` : &quot;例如：个人知识系统&quot;;
        addField(&quot;标题&quot;, titleInput, true);

        const kindSelect = document.createElement(&quot;select&quot;);
        Object.entries(goalKinds).forEach(([value, label]) =&gt; {
          const option = document.createElement(&quot;option&quot;);
          option.value = value;
          option.textContent = label;
          kindSelect.appendChild(option);
        });
        kindSelect.value = node?.kind || inferChildKind(parent);
        addField(&quot;节点类型&quot;, kindSelect);

        const parentSelect = document.createElement(&quot;select&quot;);
        const rootOption = document.createElement(&quot;option&quot;);
        rootOption.value = &quot;&quot;;
        rootOption.textContent = &quot;顶层&quot;;
        parentSelect.appendChild(rootOption);
        const blocked = node ? new Set([node.id, ...getGoalDescendantIds(node.id)]) : new Set();
        goalNodes
          .filter((candidate) =&gt; candidate.kind !== &quot;task&quot; &amp;&amp; !candidate.archived &amp;&amp; !blocked.has(candidate.id))
          .sort((first, second) =&gt; getGoalPath(first).join(&quot;/&quot;).localeCompare(getGoalPath(second).join(&quot;/&quot;), &quot;zh-CN&quot;))
          .forEach((candidate) =&gt; {
            const option = document.createElement(&quot;option&quot;);
            option.value = candidate.id;
            option.textContent = getGoalPath(candidate).join(&quot; / &quot;);
            parentSelect.appendChild(option);
          });
        parentSelect.value = parent?.id || &quot;&quot;;
        addField(&quot;归属到&quot;, parentSelect);

        const startInput = document.createElement(&quot;input&quot;);
        startInput.type = &quot;date&quot;;
        startInput.value = node?.start || &quot;&quot;;
        addField(&quot;开始日期（可选）&quot;, startInput);

        const endInput = document.createElement(&quot;input&quot;);
        endInput.type = &quot;date&quot;;
        endInput.value = node?.end || &quot;&quot;;
        addField(&quot;结束日期（可选）&quot;, endInput);

        const scheduleSelect = document.createElement(&quot;select&quot;);
        for (const [value, label] of [
          [&quot;custom&quot;, &quot;长期 / 自定义&quot;],
          [&quot;daily&quot;, &quot;每天&quot;],
          [&quot;weekly&quot;, &quot;每周&quot;],
          [&quot;one-off&quot;, &quot;一次性&quot;],
        ]) {
          const option = document.createElement(&quot;option&quot;);
          option.value = value;
          option.textContent = label;
          scheduleSelect.appendChild(option);
        }
        scheduleSelect.value = node?.schedule || (kindSelect.value === &quot;task&quot; ? &quot;one-off&quot; : &quot;custom&quot;);
        addField(&quot;打卡频率&quot;, scheduleSelect);

        const note = document.createElement(&quot;label&quot;);
        note.className = &quot;jd-goal-form-note&quot;;
        const collect = document.createElement(&quot;input&quot;);
        collect.type = &quot;checkbox&quot;;
        collect.checked = node?.showInToday ?? kindSelect.value === &quot;task&quot;;
        note.append(collect, document.createTextNode(&quot;出现在今日快捷打卡&quot;));
        form.append(head, grid, note);

        const actions = document.createElement(&quot;div&quot;);
        actions.className = &quot;jd-goal-form-actions&quot;;
        const cancel = document.createElement(&quot;button&quot;);
        cancel.type = &quot;button&quot;;
        cancel.className = &quot;jd-goal-cancel&quot;;
        cancel.textContent = &quot;取消&quot;;
        cancel.addEventListener(&quot;click&quot;, () =&gt; host.replaceChildren());
        const save = document.createElement(&quot;button&quot;);
        save.type = &quot;submit&quot;;
        save.className = &quot;jd-goal-save&quot;;
        save.textContent = config.mode === &quot;create&quot; ? &quot;保存到目标树&quot; : &quot;保存修改&quot;;
        actions.append(cancel, save);
        form.appendChild(actions);

        kindSelect.addEventListener(&quot;change&quot;, () =&gt; {
          if (kindSelect.value === &quot;task&quot; &amp;&amp; scheduleSelect.value === &quot;custom&quot;) {
            scheduleSelect.value = &quot;one-off&quot;;
          }
        });

        form.addEventListener(&quot;submit&quot;, (event) =&gt; {
          event.preventDefault();
          const titleValue = titleInput.value.trim();
          if (!titleValue) {
            titleInput.setAttribute(&quot;aria-invalid&quot;, &quot;true&quot;);
            titleInput.focus();
            return;
          }
          titleInput.removeAttribute(&quot;aria-invalid&quot;);
          const nextParentId = parentSelect.value || null;
          if (nextParentId &amp;&amp; (!node || nextParentId !== node.id)) {
            if (node &amp;&amp; getGoalDescendantIds(node.id).includes(nextParentId)) {
              showGoalStatus(scope, &quot;不能把节点移动到自己的下级中。&quot;);
              return;
            }
          }

          if (config.mode === &quot;create&quot;) {
            goalNodes.push({
              id: `goal-${Date.now()}`,
              parentId: nextParentId,
              title: titleValue,
              kind: kindSelect.value,
              progressMode: kindSelect.value === &quot;task&quot; ? &quot;manual&quot; : &quot;children&quot;,
              done: false,
              expanded: true,
              start: startInput.value,
              end: endInput.value,
              schedule: scheduleSelect.value,
              showInToday: collect.checked,
            });
          } else if (node) {
            node.title = titleValue;
            node.kind = kindSelect.value;
            node.parentId = nextParentId;
            node.start = startInput.value;
            node.end = endInput.value;
            node.schedule = scheduleSelect.value;
            node.showInToday = collect.checked;
          }
          if (nextParentId) {
            const nextParent = getGoal(nextParentId);
            if (nextParent) nextParent.expanded = true;
          }
          host.replaceChildren();
          renderGoalTrees();
          showGoalStatus(
            scope,
            config.mode === &quot;create&quot;
              ? `已新建：${titleValue}${nextParentId ? ` · 归属 ${getGoalPath(getGoal(nextParentId)).join(&quot; / &quot;)}` : &quot; · 顶层&quot;}`
              : `已保存：${titleValue}`
          );
        });

        host.replaceChildren(form);
        renderGoalTrees();
        requestAnimationFrame(() =&gt; titleInput.focus());
      }

      globalRoot.querySelectorAll(&quot;[data-jd-goal-new]&quot;).forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          openGoalForm(button.dataset.jdGoalNew, { mode: &quot;create&quot;, parentId: null });
        });
      });

      const goalHeatLevels = [2, 4, 3, 0, 1, 2, 3, 4, 2, 1, 0, 3, 4, 3, 2, 1, 4, 4, 2, 0, 3, 2, 1, 4, 3, 2, 4, 4];
      globalRoot.querySelectorAll(&quot;[data-jd-goal-heatmap]&quot;).forEach((heatmap) =&gt; {
        const cells = document.createDocumentFragment();
        for (let index = 0; index &lt; 28; index += 1) {
          const cell = document.createElement(&quot;span&quot;);
          cell.className = &quot;jd-goal-heat-cell&quot;;
          cell.dataset.level = String(goalHeatLevels[index]);
          cell.setAttribute(&quot;aria-label&quot;, `第 ${index + 1} 天，完成度 ${goalHeatLevels[index] * 25}%`);
          cells.appendChild(cell);
        }
        heatmap.replaceChildren(cells);
      });

      function closeRelatedPanels() {
        globalRoot.querySelectorAll(&quot;[data-jd-related-panel]&quot;).forEach((panel) =&gt; {
          panel.hidden = true;
          panel.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
        });
        globalRoot.querySelectorAll(&quot;[data-jd-related-backdrop]&quot;).forEach((backdrop) =&gt; {
          backdrop.hidden = true;
        });
        syncMobileScrollLock();
      }

      function openRelatedPanel(scope) {
        closeRelatedPanels();
        const panel = globalRoot.querySelector(`[data-jd-related-panel=&quot;${scope}&quot;]`);
        const backdrop = globalRoot.querySelector(`[data-jd-related-backdrop=&quot;${scope}&quot;]`);
        if (!panel || !backdrop) return;
        panel.hidden = false;
        panel.setAttribute(&quot;aria-hidden&quot;, &quot;false&quot;);
        backdrop.hidden = false;
        syncMobileScrollLock();
        requestAnimationFrame(() =&gt; panel.querySelector(&quot;[data-jd-related-close]&quot;)?.focus());
      }

      globalRoot.querySelectorAll(&quot;[data-jd-related-open]&quot;).forEach((trigger) =&gt; {
        trigger.addEventListener(&quot;click&quot;, () =&gt; {
          const scope = trigger.closest(&quot;.jd-phone&quot;) ? &quot;mobile&quot; : &quot;desktop&quot;;
          openRelatedPanel(scope);
        });
      });

      globalRoot.querySelectorAll(&quot;[data-jd-related-backdrop]&quot;).forEach((backdrop) =&gt; {
        backdrop.addEventListener(&quot;click&quot;, closeRelatedPanels);
      });
      globalRoot.querySelectorAll(&quot;[data-jd-related-close]&quot;).forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, closeRelatedPanels);
      });
      globalRoot.querySelectorAll(&quot;[data-jd-related-day]&quot;).forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          const label = button.dataset.jdRelatedDay;
          const dayMatch = label.match(/(\d+)/);
          const day = dayMatch ? Number(dayMatch[1]) : 14;
          closeRelatedPanels();
          if (button.closest(&quot;.jd-phone&quot;)) {
            setMobilePage(&quot;journal&quot;);
            selectMobileDate(dateKey(2026, 10, day), day, true);
          } else {
            setDesktopPage(&quot;journal&quot;);
            desktopTitle.textContent = `11 月 ${day} 日`;
            desktopSubtitle.textContent = `${monthNames[new Date(2026, 10, day).getDay()]} · ${
              day &lt; 14 ? &quot;曾经&quot; : day === 14 ? &quot;当下&quot; : &quot;未来&quot;
            }`;
          }
        });
      });

      globalRoot.addEventListener(&quot;click&quot;, (event) =&gt; {
        if (!event.target.closest(&quot;.jd-goal-menu, .jd-goal-more&quot;)) closeGoalMenus();
      });

      renderGoalTrees();
      globalRoot.querySelector(&quot;[data-jd-mobile-create]&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        setMobileSearch(false);
        setMobileMenu(false);
        closeMobileChromePanels();
        setMobileQuickActive(&quot;&quot;);
        setMobilePage(&quot;journal&quot;);
        selectMobileDate(todayKey, 14, true);
        window.setTimeout(() =&gt; mobileCapture.focus(), 0);
      });

      globalRoot.querySelectorAll(&quot;.jd-nav&quot;).forEach((nav) =&gt; {
        nav.addEventListener(&quot;click&quot;, (event) =&gt; {
          const button = event.target.closest(&quot;button&quot;);
          if (!button) return;
          nav.querySelectorAll(&quot;button&quot;).forEach((item) =&gt; item.classList.toggle(&quot;is-active&quot;, item === button));
          if (button.dataset.jdMobilePage) {
            setMobileMenu(false);
            setMobilePage(button.dataset.jdMobilePage);
          }
        });
      });

      globalRoot.querySelectorAll(&quot;.jd-check&quot;).forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          const task = button.dataset.jdTaskId ? getGoal(button.dataset.jdTaskId) : null;
          if (task) {
            task.done = !task.done;
            renderGoalTrees();
            return;
          }
          button.classList.toggle(&quot;is-done&quot;);
          const mark = button.querySelector(&quot;i&quot;);
          mark.textContent = button.classList.contains(&quot;is-done&quot;) ? &quot;✓&quot; : &quot;&quot;;
        });
      });

      function appendComposerTag(composer, tag) {
        const textarea = composer.querySelector(&quot;textarea&quot;);
        const token = tag.startsWith(&quot;#&quot;) ? tag : `#${tag}`;
        if (textarea.value.includes(token)) {
          textarea.focus();
          return;
        }
        const start = textarea.selectionStart ?? textarea.value.length;
        const end = textarea.selectionEnd ?? start;
        const prefix = textarea.value &amp;&amp; start &gt; 0 &amp;&amp; !/\s$/.test(textarea.value.slice(0, start)) ? &quot; &quot; : &quot;&quot;;
        textarea.setRangeText(`${prefix}${token} `, start, end, &quot;end&quot;);
        textarea.focus();
      }

      function showComposerFeedback(composer, message) {
        let feedback = composer.querySelector(&quot;.jd-composer-feedback&quot;);
        if (!feedback) {
          feedback = document.createElement(&quot;div&quot;);
          feedback.className = &quot;jd-composer-feedback&quot;;
          feedback.setAttribute(&quot;role&quot;, &quot;status&quot;);
          composer.querySelector(&quot;.jd-composer-foot&quot;)?.before(feedback);
        }
        feedback.textContent = message;
        feedback.hidden = false;
        window.setTimeout(() =&gt; {
          feedback.hidden = true;
        }, 1800);
      }

      function createComposerPanel(composer, type) {
        const existing = composer.querySelector(`[data-jd-panel=&quot;${type}&quot;]`);
        if (existing) return existing;

        const panel = document.createElement(&quot;section&quot;);
        panel.className = &quot;jd-composer-panel&quot;;
        panel.dataset.jdPanel = type;

        const head = document.createElement(&quot;div&quot;);
        head.className = &quot;jd-composer-panel-head&quot;;
        const title = document.createElement(&quot;strong&quot;);
        title.textContent =
          type === &quot;book&quot; ? &quot;#book&quot; : type === &quot;longform&quot; ? &quot;#长文&quot; : &quot;选择已有标签&quot;;
        const close = document.createElement(&quot;button&quot;);
        close.type = &quot;button&quot;;
        close.className = &quot;jd-panel-close&quot;;
        close.setAttribute(&quot;aria-label&quot;, &quot;收起面板&quot;);
        close.textContent = &quot;×&quot;;
        close.addEventListener(&quot;click&quot;, () =&gt; {
          panel.hidden = true;
        });
        head.append(title, close);
        panel.appendChild(head);

        if (type === &quot;book&quot;) {
          const fields = document.createElement(&quot;div&quot;);
          fields.className = &quot;jd-book-fields&quot;;

          const addField = (labelText, control, wide = false) =&gt; {
            const label = document.createElement(&quot;label&quot;);
            if (wide) label.classList.add(&quot;is-wide&quot;);
            label.textContent = labelText;
            label.appendChild(control);
            fields.appendChild(label);
          };

          const bookTitle = document.createElement(&quot;input&quot;);
          bookTitle.type = &quot;text&quot;;
          bookTitle.placeholder = &quot;例如：朝花夕拾&quot;;
          addField(&quot;书籍&quot;, bookTitle, true);

          const author = document.createElement(&quot;input&quot;);
          author.type = &quot;text&quot;;
          author.placeholder = &quot;鲁迅&quot;;
          addField(&quot;作者&quot;, author);

          const status = document.createElement(&quot;select&quot;);
          for (const [value, label] of [[&quot;reading&quot;, &quot;在读&quot;], [&quot;completed&quot;, &quot;读完&quot;]]) {
            const option = document.createElement(&quot;option&quot;);
            option.value = value;
            option.textContent = label;
            status.appendChild(option);
          }
          addField(&quot;阅读状态&quot;, status);

          const goal = document.createElement(&quot;select&quot;);
          for (const label of [&quot;2026 年读完 50 本&quot;, &quot;暂不关联目标&quot;]) {
            const option = document.createElement(&quot;option&quot;);
            option.textContent = label;
            goal.appendChild(option);
          }
          const goalLabel = document.createElement(&quot;label&quot;);
          goalLabel.classList.add(&quot;is-wide&quot;);
          goalLabel.textContent = &quot;计入目标&quot;;
          goalLabel.appendChild(goal);
          fields.appendChild(goalLabel);

          const save = document.createElement(&quot;button&quot;);
          save.type = &quot;button&quot;;
          save.className = &quot;jd-panel-action&quot;;
          save.textContent = &quot;关联这条记录&quot;;
          save.addEventListener(&quot;click&quot;, () =&gt; {
            const name = bookTitle.value.trim() || &quot;这本书&quot;;
            showComposerFeedback(
              composer,
              status.value === &quot;completed&quot; ? `已关联：${name} · ${goal.value}` : `已保存：${name} · 在读`
            );
          });
          panel.append(fields, save);
        } else if (type === &quot;longform&quot;) {
          const fields = document.createElement(&quot;div&quot;);
          fields.className = &quot;jd-book-fields&quot;;

          const addField = (labelText, control, wide = false) =&gt; {
            const label = document.createElement(&quot;label&quot;);
            if (wide) label.classList.add(&quot;is-wide&quot;);
            label.textContent = labelText;
            label.appendChild(control);
            fields.appendChild(label);
          };

          const longformTitle = document.createElement(&quot;input&quot;);
          longformTitle.type = &quot;text&quot;;
          longformTitle.placeholder = &quot;例如：为什么我想重做每日记录&quot;;
          addField(&quot;长文标题&quot;, longformTitle, true);

          const reference = document.createElement(&quot;select&quot;);
          for (const label of [
            &quot;引用：11 月 11 日的原始笔记&quot;,
            &quot;引用：《朝花夕拾》书评&quot;,
            &quot;暂不引用其他记录&quot;,
          ]) {
            const option = document.createElement(&quot;option&quot;);
            option.textContent = label;
            reference.appendChild(option);
          }
          const referenceLabel = document.createElement(&quot;label&quot;);
          referenceLabel.classList.add(&quot;is-wide&quot;);
          referenceLabel.textContent = &quot;关联已有记录&quot;;
          referenceLabel.appendChild(reference);
          fields.appendChild(referenceLabel);

          const note = document.createElement(&quot;p&quot;);
          note.className = &quot;jd-composer-feedback&quot;;
          note.textContent = &quot;正文保存到 Longform；Daily 只留下摘要、入口和可反向定位的块引用。&quot;;

          const save = document.createElement(&quot;button&quot;);
          save.type = &quot;button&quot;;
          save.className = &quot;jd-panel-action&quot;;
          save.textContent = &quot;创建长文并保留入口&quot;;
          save.addEventListener(&quot;click&quot;, () =&gt; {
            const name = longformTitle.value.trim() || &quot;未命名长文&quot;;
            showComposerFeedback(composer, `已创建长文：${name} · Daily 入口与引用已保留`);
            panel.hidden = true;
          });
          panel.append(fields, note, save);
        } else {
          const choices = document.createElement(&quot;div&quot;);
          choices.className = &quot;jd-tag-choices&quot;;
          [&quot;此刻的心情&quot;, &quot;产品设计&quot;, &quot;读后感&quot;, &quot;生活&quot;, &quot;旅行&quot;].forEach((tag) =&gt; {
            const button = document.createElement(&quot;button&quot;);
            button.type = &quot;button&quot;;
            button.className = &quot;jd-tag-choice&quot;;
            button.textContent = `#${tag}`;
            button.addEventListener(&quot;click&quot;, () =&gt; {
              appendComposerTag(composer, tag);
              panel.hidden = true;
            });
            choices.appendChild(button);
          });
          panel.appendChild(choices);
        }

        composer.querySelector(&quot;.jd-prompt-row&quot;).insertAdjacentElement(&quot;afterend&quot;, panel);
        return panel;
      }

      globalRoot.querySelectorAll(&quot;.jd-composer&quot;).forEach((composer) =&gt; {
        const textarea = composer.querySelector(&quot;textarea&quot;);
        const toolButtons = [...composer.querySelectorAll(&quot;.jd-tool&quot;)];
        const sendButton = composer.querySelector(&quot;.jd-send&quot;);
        const resizeComposer = () =&gt; {
          textarea.style.height = &quot;auto&quot;;
          textarea.style.height = `${textarea.scrollHeight}px`;
        };
        textarea.addEventListener(&quot;input&quot;, resizeComposer);
        requestAnimationFrame(resizeComposer);

        composer.querySelectorAll(&quot;.jd-prompt&quot;).forEach((button) =&gt; {
          button.addEventListener(&quot;click&quot;, () =&gt; {
            appendComposerTag(composer, button.textContent.trim());
          });
        });

        toolButtons.forEach((button) =&gt; {
          const label = button.textContent.trim();
          const icon = button.querySelector(&quot;[data-lucide]&quot;)?.getAttribute(&quot;data-lucide&quot;);
          const action = icon === &quot;image-plus&quot; || label === &quot;图片&quot;
            ? &quot;image&quot;
            : icon === &quot;book-open&quot; || label === &quot;#book&quot;
              ? &quot;book&quot;
              : icon === &quot;file-text&quot; || label === &quot;#长文&quot;
                ? &quot;longform&quot;
              : &quot;tag&quot;;
          button.addEventListener(&quot;click&quot;, () =&gt; {
            if (action === &quot;book&quot; || action === &quot;longform&quot; || action === &quot;tag&quot;) {
              composer.querySelectorAll(&quot;.jd-composer-panel&quot;).forEach((panel) =&gt; {
                panel.hidden = true;
              });
              if (action === &quot;book&quot;) appendComposerTag(composer, &quot;#book&quot;);
              if (action === &quot;longform&quot;) appendComposerTag(composer, &quot;#长文&quot;);
              const panel = createComposerPanel(composer, action);
              panel.hidden = false;
              return;
            }

            if (action === &quot;image&quot;) {
              const fileInput = document.createElement(&quot;input&quot;);
              fileInput.type = &quot;file&quot;;
              fileInput.accept = &quot;image/*&quot;;
              fileInput.hidden = true;
              let preview = composer.querySelector(&quot;.jd-image-preview&quot;);
              if (!preview) {
                preview = document.createElement(&quot;div&quot;);
                preview.className = &quot;jd-image-preview&quot;;
                preview.hidden = true;
                textarea.insertAdjacentElement(&quot;afterend&quot;, preview);
              }
              fileInput.addEventListener(&quot;change&quot;, () =&gt; {
                const file = fileInput.files?.[0];
                if (!file) return;
                preview.replaceChildren();

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  const isShare = document.documentElement.classList.contains(
    "visualization-share-root",
  );
  let viewportHeight = globalThis.innerHeight;
  let sizeFingerprint = null;
  let sizeWriteTimeout;
  let lastSize = null;
  let pendingSize = null;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const sizeStorageKey = `${storageKey}:share-size-v1`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
