      const libraryTagPanel = root.querySelector(&quot;[data-library-tag-panel]&quot;);
      const libraryCards = [...root.querySelectorAll(&quot;[data-library-card]&quot;)];
      const libraryTypeFilters = [...root.querySelectorAll(&quot;[data-library-type]&quot;)];
      const libraryTagFilters = [...root.querySelectorAll(&quot;[data-library-tag]&quot;)];
      const libraryEmpty = root.querySelector(&quot;[data-library-empty]&quot;);
      const libraryCount = root.querySelector(&quot;[data-library-count]&quot;);
      const taskSection = root.querySelector(&quot;.cn-checkin-section&quot;);
      const taskList = taskSection.querySelector(&quot;.cn-task-list&quot;);
      const timelineSection = root.querySelector(&quot;[aria-label=&#x27;当天记录时间线&#x27;]&quot;);
      const checkinToggle = root.querySelector(&quot;[data-toggle-checkins]&quot;);
      const checkinToolbar = root.querySelector(&quot;[data-checkin-toolbar]&quot;);
      const goalPanel = root.querySelector(&quot;[data-goal-panel]&quot;);
      const goalPanelToggle = root.querySelector(&quot;[data-toggle-goal-panel]&quot;);
      const checkinZone = okrView;
      let selectedDay = 11;
      const historyAppends = new Map();
      let defaultCheckinTemplates = [];

      calendarView.appendChild(timelineSection);
      taskList.hidden = true;

      const mainTabs = [...root.querySelectorAll(&quot;[data-main-tab]&quot;)];

      function setMainView(view) {
        calendarView.hidden = view !== &quot;calendar&quot;;
        okrView.hidden = view !== &quot;okr&quot;;
        libraryView.hidden = view !== &quot;library&quot;;
        mainTabs.forEach((tab) =&gt; {
          const active = tab.dataset.mainTab === view;
          tab.classList.toggle(&quot;is-active&quot;, active);
          tab.setAttribute(&quot;aria-selected&quot;, String(active));
        });
      }

      mainTabs.forEach((tab) =&gt; {
        tab.addEventListener(&quot;click&quot;, () =&gt; setMainView(tab.dataset.mainTab));
      });

      let activeLibraryType = &quot;all&quot;;
      let activeLibraryTag = &quot;&quot;;

      function setLibraryCardExpanded(card, expanded) {
        const detail = card.nextElementSibling;
        if (!detail?.matches(&quot;[data-library-detail]&quot;)) return;
        detail.hidden = !expanded;
        card.classList.toggle(&quot;is-expanded&quot;, expanded);
        card.setAttribute(&quot;aria-expanded&quot;, String(expanded));
        const label = card.querySelector(&quot;.cn-content-toggle-label&quot;);
        if (label) label.textContent = expanded ? &quot;收起&quot; : &quot;展开内容&quot;;
      }

      function collapseLibraryCards(except = null) {
        libraryCards.forEach((card) =&gt; {
          if (card !== except) setLibraryCardExpanded(card, false);
        });
      }

      libraryCards.forEach((card, index) =&gt; {
        const detail = card.nextElementSibling;
        const copy = card.querySelector(&quot;.cn-content-card-copy&quot;);
        if (!detail?.matches(&quot;[data-library-detail]&quot;) || !copy) return;
        const detailId = `cn-library-detail-${index + 1}`;
        detail.id = detailId;
        card.setAttribute(&quot;aria-controls&quot;, detailId);
        card.setAttribute(&quot;aria-expanded&quot;, &quot;false&quot;);

        const toggle = document.createElement(&quot;span&quot;);
        toggle.className = &quot;cn-content-toggle&quot;;
        const toggleLabel = document.createElement(&quot;span&quot;);
        toggleLabel.className = &quot;cn-content-toggle-label&quot;;
        toggleLabel.textContent = &quot;展开内容&quot;;
        const toggleIcon = document.createElement(&quot;i&quot;);
        toggleIcon.dataset.lucide = &quot;chevron-down&quot;;
        toggleIcon.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
        toggle.append(toggleLabel, toggleIcon);
        copy.appendChild(toggle);

        card.addEventListener(&quot;click&quot;, () =&gt; {
          const opening = card.getAttribute(&quot;aria-expanded&quot;) !== &quot;true&quot;;
          collapseLibraryCards(card);
          setLibraryCardExpanded(card, opening);
        });
      });

      function filterContentLibrary() {
        const query = librarySearch.value.trim().toLocaleLowerCase(&quot;zh-CN&quot;);
        let visibleCount = 0;
        libraryCards.forEach((card) =&gt; {
          const typeMatches =
            activeLibraryType === &quot;all&quot; || card.dataset.contentType === activeLibraryType;
          const tags = (card.dataset.libraryTags || &quot;&quot;).split(/\s+/).filter(Boolean);
          const tagMatches = !activeLibraryTag || tags.includes(activeLibraryTag);
          const queryMatches =
            !query || (card.dataset.librarySearch || &quot;&quot;).toLocaleLowerCase(&quot;zh-CN&quot;).includes(query);
          const visible = typeMatches &amp;&amp; tagMatches &amp;&amp; queryMatches;
          card.hidden = !visible;
          if (!visible) setLibraryCardExpanded(card, false);
          if (visible) visibleCount += 1;
        });
        libraryCount.textContent = `${visibleCount} 条内容`;
        libraryEmpty.hidden = visibleCount &gt; 0;
      }

      librarySearch.addEventListener(&quot;input&quot;, filterContentLibrary);
      libraryTagToggle.addEventListener(&quot;click&quot;, () =&gt; {
        const opening = libraryTagPanel.hidden;
        libraryTagPanel.hidden = !opening;
        libraryTagToggle.setAttribute(&quot;aria-expanded&quot;, String(opening));
      });
      libraryTypeFilters.forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          activeLibraryType = button.dataset.libraryType;
          libraryTypeFilters.forEach((other) =&gt; {
            const active = other === button;
            other.classList.toggle(&quot;is-active&quot;, active);
            other.setAttribute(&quot;aria-pressed&quot;, String(active));
          });
          filterContentLibrary();
        });
      });
      libraryTagFilters.forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          const nextTag = button.dataset.libraryTag;
          activeLibraryTag = activeLibraryTag === nextTag ? &quot;&quot; : nextTag;
          libraryTagFilters.forEach((other) =&gt; {
            const active = other.dataset.libraryTag === activeLibraryTag;
            other.classList.toggle(&quot;is-active&quot;, active);
            other.setAttribute(&quot;aria-pressed&quot;, String(active));
          });
          filterContentLibrary();
        });
      });

      function renderQuickCheckins() {
        quickCheckins.replaceChildren();
        const tasks = [...root.querySelectorAll(&quot;.cn-task&quot;)].slice(0, 3);
        tasks.forEach((task) =&gt; {
          const input = task.querySelector(&quot;input[type=&#x27;checkbox&#x27;]&quot;);
          const title =
            task.querySelector(&quot;.cn-task-title&quot;)?.textContent?.trim() || &quot;未命名打卡&quot;;
          const goalKey = input?.dataset.goalTask || &quot;content&quot;;
          const goal = goalPaths[goalKey];

          const row = document.createElement(&quot;div&quot;);
          row.className = &quot;cn-capture-checkin-row&quot;;

          const toggle = document.createElement(&quot;button&quot;);
          toggle.type = &quot;button&quot;;
          toggle.className = &quot;cn-capture-checkin-toggle&quot;;
          toggle.setAttribute(&quot;aria-pressed&quot;, String(Boolean(input?.checked)));
          toggle.setAttribute(&quot;aria-label&quot;, `${input?.checked ? &quot;取消完成&quot; : &quot;完成&quot;}：${title}`);
          const circle = document.createElement(&quot;span&quot;);
          circle.className = &quot;cn-capture-checkin-circle&quot;;
          if (input?.checked) {
            const check = document.createElement(&quot;i&quot;);
            check.dataset.lucide = &quot;check&quot;;
            check.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
            circle.appendChild(check);
          }
          toggle.appendChild(circle);
          toggle.addEventListener(&quot;click&quot;, () =&gt; {
            if (!input) return;
            input.checked = !input.checked;
            input.dispatchEvent(new Event(&quot;change&quot;, { bubbles: true }));
          });

          const open = document.createElement(&quot;button&quot;);
          open.type = &quot;button&quot;;
          open.className = &quot;cn-capture-checkin-open&quot;;
          open.setAttribute(&quot;aria-label&quot;, `在任务选项中查看：${title}`);
          const copy = document.createElement(&quot;span&quot;);
          copy.className = &quot;cn-capture-checkin-copy&quot;;
          const titleNode = document.createElement(&quot;span&quot;);
          titleNode.className = &quot;cn-capture-checkin-title&quot;;
          titleNode.textContent = title;
          const path = document.createElement(&quot;span&quot;);
          path.className = &quot;cn-capture-checkin-path&quot;;
          path.textContent = goal
            ? `${goal.year.replace(&quot;年度 · &quot;, &quot;&quot;)} · ${goal.sprint}`
            : &quot;未归属目标&quot;;
          copy.append(titleNode, path);
          const arrow = document.createElement(&quot;i&quot;);
          arrow.dataset.lucide = &quot;chevron-right&quot;;
          arrow.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
          open.append(copy, arrow);
          open.addEventListener(&quot;click&quot;, () =&gt; {
            setMainView(&quot;okr&quot;);
            const card = root.querySelector(`[data-okr-goal=&quot;${goalKey}&quot;]`);
            if (card) {
              card.classList.add(&quot;is-focus-flash&quot;);
              requestAnimationFrame(() =&gt; {
                card.scrollIntoView({ block: &quot;nearest&quot;, behavior: &quot;smooth&quot; });
              });
              window.setTimeout(() =&gt; card.classList.remove(&quot;is-focus-flash&quot;), 650);
            }
          });

          row.append(toggle, open);
          quickCheckins.appendChild(row);
        });
        globalThis.lucide?.createIcons({ attrs: { width: 12, height: 12 } });
      }

      function setGoalPanelOpen(open) {
        goalPanel.hidden = !open;
        goalPanelToggle.setAttribute(&quot;aria-expanded&quot;, String(open));
        goalPanelToggle.setAttribute(
          &quot;aria-label&quot;,
          `${open ? &quot;收起&quot; : &quot;展开&quot;}目标管理，年度目标总完成度 ${ringValue.textContent}`

      goalPanelToggle.addEventListener(&quot;click&quot;, () =&gt; {

      function updateCheckinControls() {
        const tasks = [...root.querySelectorAll(&quot;.cn-task&quot;)];

      function setCheckinsExpanded(expanded) {

          const creator = root.querySelector(&quot;[data-task-creator]&quot;);

      }

      checkinToggle.addEventListener(&quot;click&quot;, () =&gt; {
        setCheckinsExpanded(checkinToggle.getAttribute(&quot;aria-expanded&quot;) !== &quot;true&quot;);
      });

      function setupDefaultCheckinSettings() {
        const openButton = root.querySelector(&quot;[data-open-default-settings]&quot;);
        const panel = root.querySelector(&quot;[data-default-settings]&quot;);
        const rows = root.querySelector(&quot;[data-default-rows]&quot;);
        const addButton = root.querySelector(&quot;[data-add-default]&quot;);
        const saveButton = root.querySelector(&quot;[data-save-defaults]&quot;);
        const status = root.querySelector(&quot;[data-default-status]&quot;);

        if (!defaultCheckinTemplates.length) {
          const tasks = [...root.querySelectorAll(&quot;.cn-task&quot;)];
          defaultCheckinTemplates = tasks.slice(0, 3).map((task) =&gt; ({
            title:
              task.querySelector(&quot;.cn-task-title&quot;)?.textContent?.trim() || &quot;新的每日打卡&quot;,
            goal: task.querySelector(&quot;input[type=&#x27;checkbox&#x27;]&quot;)?.dataset.goalTask || &quot;content&quot;,
          }));
          while (defaultCheckinTemplates.length &lt; 3) {
            defaultCheckinTemplates.push({ title: &quot;&quot;, goal: &quot;content&quot; });
          }
        }

        const appendRow = (template) =&gt; {
          const row = document.createElement(&quot;div&quot;);
          row.className = &quot;cn-default-row&quot;;
          const input = document.createElement(&quot;input&quot;);
          input.type = &quot;text&quot;;
          input.value = template.title;
          input.placeholder = &quot;例如：散步 10 分钟&quot;;
          input.setAttribute(&quot;aria-label&quot;, &quot;默认打卡内容&quot;);
          const select = document.createElement(&quot;select&quot;);
          select.setAttribute(&quot;aria-label&quot;, &quot;默认打卡归属目标&quot;);
          Object.entries(goalPaths).forEach(([key, goal]) =&gt; {
            const option = document.createElement(&quot;option&quot;);
            option.value = key;
            option.textContent = goal.sprint;
            option.selected = key === template.goal;
            select.appendChild(option);
          });
          const remove = document.createElement(&quot;button&quot;);
          remove.type = &quot;button&quot;;
          remove.className = &quot;cn-default-remove&quot;;
          remove.setAttribute(&quot;aria-label&quot;, &quot;删除默认打卡&quot;);
          const icon = document.createElement(&quot;i&quot;);
          icon.dataset.lucide = &quot;x&quot;;
          icon.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
          remove.appendChild(icon);
          remove.addEventListener(&quot;click&quot;, () =&gt; row.remove());
          row.append(input, select, remove);
          rows.appendChild(row);
        };

        const renderRows = () =&gt; {
          rows.replaceChildren();
          defaultCheckinTemplates.forEach(appendRow);
          globalThis.lucide?.createIcons({ attrs: { width: 13, height: 13 } });
        };

        openButton.addEventListener(&quot;click&quot;, () =&gt; {
          const opening = panel.hidden;
          panel.hidden = !opening;
          openButton.setAttribute(&quot;aria-expanded&quot;, String(opening));
          openButton.setAttribute(&quot;aria-label&quot;, opening ? &quot;关闭每日默认打卡设置&quot; : &quot;设置每日默认打卡&quot;);
          if (opening) {
            renderRows();
            window.setTimeout(() =&gt; rows.querySelector(&quot;input&quot;)?.focus(), 0);
          }
        });

        addButton.addEventListener(&quot;click&quot;, () =&gt; {
          appendRow({ title: &quot;&quot;, goal: &quot;content&quot; });
          globalThis.lucide?.createIcons({ attrs: { width: 13, height: 13 } });
          window.setTimeout(() =&gt; rows.lastElementChild?.querySelector(&quot;input&quot;)?.focus(), 0);
        });

        saveButton.addEventListener(&quot;click&quot;, () =&gt; {
          defaultCheckinTemplates = [...rows.querySelectorAll(&quot;.cn-default-row&quot;)]
            .map((row) =&gt; ({
              title: row.querySelector(&quot;input&quot;)?.value.trim() || &quot;&quot;,
              goal: row.querySelector(&quot;select&quot;)?.value || &quot;content&quot;,
            }))
            .filter((template) =&gt; template.title);
          status.textContent = &quot;已保存，明天开始使用&quot;;
          window.setTimeout(() =&gt; {
            panel.hidden = true;
            status.textContent = &quot;&quot;;
            openButton.setAttribute(&quot;aria-expanded&quot;, &quot;false&quot;);
            openButton.setAttribute(&quot;aria-label&quot;, &quot;设置每日默认打卡&quot;);
          }, 700);
        });
      }

      const goalPaths = {
        content: {
          group: &quot;content&quot;,
          sprint: &quot;完成日记插件首页&quot;,
          year: &quot;年度 · 内容输出&quot;,
          stage: &quot;阶段 · 网站 1.0&quot;,
          final: &quot;冲刺 · 插件首页&quot;,
        },
        health: {
          group: &quot;health&quot;,
          sprint: &quot;11 月活力计划&quot;,
          year: &quot;年度 · 改善身体状态&quot;,
          stage: &quot;阶段 · 每周三次运动&quot;,
          final: &quot;冲刺 · 11 月活力计划&quot;,
        },
        knowledge: {
          group: &quot;knowledge&quot;,
          sprint: &quot;整理个人知识库&quot;,
          year: &quot;年度 · 个人知识系统&quot;,
          stage: &quot;阶段 · 输入与整理&quot;,
          final: &quot;冲刺 · 整理个人知识库&quot;,
        },
      };

      function setTaskPath(task, goal) {
        const path = task.querySelector(&quot;.cn-task-path&quot;);
        if (!path) return;
        path.replaceChildren();
        const annual = document.createElement(&quot;span&quot;);
        annual.className = &quot;cn-task-annual-tag&quot;;
        annual.textContent = `# ${goal.year.replace(&quot;年度 · &quot;, &quot;&quot;)}`;
        const parent = document.createElement(&quot;span&quot;);
        parent.className = &quot;cn-task-parent&quot;;
        parent.textContent = `隶属于 ${goal.stage.replace(&quot;阶段 · &quot;, &quot;&quot;)} › ${goal.final.replace(
          &quot;冲刺 · &quot;,
          &quot;&quot;
        )}`;
        path.append(annual, parent);
      }

      const okrDropzones = [...root.querySelectorAll(&quot;[data-okr-dropzone]&quot;)];
      let draggedTaskItem = null;
      let touchTaskDrag = null;

      function updateOkrDropzoneStates() {
        okrDropzones.forEach((zone) =&gt; {
          zone.classList.toggle(&quot;is-empty&quot;, !zone.querySelector(&quot;.cn-task-item, .cn-task&quot;));
        });
      }

      function moveTaskItem(taskItem, goalKey, prepend = false) {
        const zone = root.querySelector(`[data-okr-dropzone=&quot;${goalKey}&quot;]`);
        const task = taskItem?.querySelector?.(&quot;.cn-task&quot;) || taskItem;
        const goal = goalPaths[goalKey];
        if (!zone || !task || !goal) return;
        const input = task.querySelector(&quot;input[type=&#x27;checkbox&#x27;]&quot;);
        if (input) input.dataset.goalTask = goalKey;
        setTaskPath(task, goal);
        if (prepend) {
          zone.prepend(taskItem);
        } else {
          zone.appendChild(taskItem);
        }
        updateOkrDropzoneStates();
        updateProgress();

      function distributeOkrTasks() {

      function clearTouchTaskDrag() {
        if (!touchTaskDrag) return;
        window.clearTimeout(touchTaskDrag.timer);
        touchTaskDrag.ghost?.remove();
        touchTaskDrag.item?.classList.remove(&quot;is-dragging&quot;);
        okrDropzones.forEach((zone) =&gt; zone.classList.remove(&quot;is-drag-over&quot;));
        touchTaskDrag = null;
      }

      function bindTaskDrag(taskItem, handle) {
        if (!taskItem || !handle || taskItem.dataset.dragReady === &quot;true&quot;) return;
        taskItem.dataset.dragReady = &quot;true&quot;;
        handle.draggable = true;

        handle.addEventListener(&quot;dragstart&quot;, (event) =&gt; {
          draggedTaskItem = taskItem;
          taskItem.classList.add(&quot;is-dragging&quot;);
          event.dataTransfer.effectAllowed = &quot;move&quot;;
          event.dataTransfer.setData(&quot;text/plain&quot;, &quot;journal-task&quot;);
          event.dataTransfer.setDragImage(taskItem, 24, 24);
        });

        handle.addEventListener(&quot;dragend&quot;, () =&gt; {
          draggedTaskItem?.classList.remove(&quot;is-dragging&quot;);
          draggedTaskItem = null;
          okrDropzones.forEach((zone) =&gt; zone.classList.remove(&quot;is-drag-over&quot;));
        });

        handle.addEventListener(&quot;pointerdown&quot;, (event) =&gt; {
          if (event.pointerType === &quot;mouse&quot;) return;
          event.preventDefault();
          handle.setPointerCapture(event.pointerId);
          const state = {
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            item: taskItem,
            active: false,
            ghost: null,
            timer: 0,
          };
          state.timer = window.setTimeout(() =&gt; {
            state.active = true;
            const rect = taskItem.getBoundingClientRect();
            const ghost = taskItem.cloneNode(true);
            ghost.classList.add(&quot;cn-task-drag-ghost&quot;);
            ghost.style.width = `${rect.width}px`;
            ghost.style.left = `${event.clientX}px`;
            ghost.style.top = `${event.clientY}px`;
            state.ghost = ghost;
            taskItem.classList.add(&quot;is-dragging&quot;);
            root.appendChild(ghost);
          }, 180);
          touchTaskDrag = state;
        });

        handle.addEventListener(&quot;pointermove&quot;, (event) =&gt; {
          if (!touchTaskDrag || touchTaskDrag.pointerId !== event.pointerId) return;
          const dx = event.clientX - touchTaskDrag.startX;
          const dy = event.clientY - touchTaskDrag.startY;
          if (!touchTaskDrag.active) {
            if (Math.hypot(dx, dy) &gt; 8) clearTouchTaskDrag();
            return;
          }
          event.preventDefault();
          touchTaskDrag.ghost.style.left = `${event.clientX}px`;
          touchTaskDrag.ghost.style.top = `${event.clientY}px`;
          const zone = document
            .elementFromPoint(event.clientX, event.clientY)
            ?.closest?.(&quot;[data-okr-dropzone]&quot;);
          okrDropzones.forEach((item) =&gt; item.classList.toggle(&quot;is-drag-over&quot;, item === zone));
        });

        handle.addEventListener(&quot;pointerup&quot;, (event) =&gt; {
          if (!touchTaskDrag || touchTaskDrag.pointerId !== event.pointerId) return;
          const state = touchTaskDrag;
          if (!state.active) {
            clearTouchTaskDrag();
            return;
          }
          const zone = document
            .elementFromPoint(event.clientX, event.clientY)
            ?.closest?.(&quot;[data-okr-dropzone]&quot;);
          const goalKey = zone?.dataset.okrDropzone;
          clearTouchTaskDrag();
          if (goalKey) moveTaskItem(state.item, goalKey);
        });

        handle.addEventListener(&quot;pointercancel&quot;, clearTouchTaskDrag);
      }

      okrDropzones.forEach((zone) =&gt; {
        zone.addEventListener(&quot;dragover&quot;, (event) =&gt; {
          if (!draggedTaskItem) return;
          event.preventDefault();
          event.dataTransfer.dropEffect = &quot;move&quot;;
          okrDropzones.forEach((item) =&gt;
            item.classList.toggle(&quot;is-drag-over&quot;, item === zone)
          );
        });

        zone.addEventListener(&quot;dragleave&quot;, () =&gt; zone.classList.remove(&quot;is-drag-over&quot;));
        zone.addEventListener(&quot;drop&quot;, (event) =&gt; {
          event.preventDefault();
          if (!draggedTaskItem) return;
          moveTaskItem(draggedTaskItem, zone.dataset.okrDropzone);
          draggedTaskItem = null;
          okrDropzones.forEach((item) =&gt; item.classList.remove(&quot;is-drag-over&quot;));
        });
      });

      function makeDay(day) {

          &quot;aria-label&quot;,
          `2026年11月${day}日${events.length ? `，${events.length}项安排` : &quot;，无安排&quot;}${
            photoCount ? `，${photoCount}张图片${brokenPhotoDays.has(day) ? &quot;，有图片异常&quot; : &quot;&quot;}` : &quot;&quot;

        if (photoCount) {

          collage.className = `cn-calendar-photos count-${Math.min(visibleCount, 4)}`;
          collage.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
          for (let index = 0; index &lt; Math.min(visibleCount, 4); index += 1) {
            const photo = document.createElement(&quot;span&quot;);

      function formatLunarDate(date) {
        const lunarDayNames = [
          &quot;初一&quot;,
          &quot;初二&quot;,
          &quot;初三&quot;,
          &quot;初四&quot;,
          &quot;初五&quot;,
          &quot;初六&quot;,

          &quot;初十&quot;,

          &quot;十五&quot;,
          &quot;十六&quot;,

          &quot;二十&quot;,

          &quot;廿二&quot;,
          &quot;廿三&quot;,
          &quot;廿四&quot;,
          &quot;廿五&quot;,
          &quot;廿六&quot;,
          &quot;廿七&quot;,
          &quot;廿八&quot;,
          &quot;廿九&quot;,
          &quot;三十&quot;,
        ];
        try {
          const formatter = new Intl.DateTimeFormat(&quot;zh-CN-u-ca-chinese&quot;, {
            month: &quot;long&quot;,
            day: &quot;numeric&quot;,
          });
          const parts = formatter.formatToParts(date);
          const month = parts.find((part) =&gt; part.type === &quot;month&quot;)?.value || &quot;&quot;;
          const day = Number(parts.find((part) =&gt; part.type === &quot;day&quot;)?.value);
          return `农历${month}${lunarDayNames[day - 1] || day}`;
        } catch {
          return &quot;&quot;;
        }
      }

        save.className = &quot;cn-reflection-save&quot;;
        save.textContent = &quot;保存&quot;;
        buttons.append(cancel, save);
        formActions.append(tag, buttons);
        form.append(input, formActions);
        actions.appendChild(toggle);
        item.append(actions, form);

        toggle.addEventListener(&quot;click&quot;, () =&gt; {
          root.querySelectorAll(&quot;.cn-reflection-form&quot;).forEach((other) =&gt; {
            if (other !== form) other.hidden = true;
          });
          form.hidden = !form.hidden;
          toggle.setAttribute(&quot;aria-expanded&quot;, String(!form.hidden));
          if (!form.hidden) window.setTimeout(() =&gt; input.focus(), 0);
        });
        cancel.addEventListener(&quot;click&quot;, () =&gt; {
          form.hidden = true;
          toggle.setAttribute(&quot;aria-expanded&quot;, &quot;false&quot;);
        });
        save.addEventListener(&quot;click&quot;, () =&gt; {
          const reflectionText = input.value.trim();
          if (!reflectionText) {
            input.focus();
            return;
          }
          const nextAppends = historyAppends.get(day) || [];
          nextAppends.push({ targetId, text: reflectionText });
          historyAppends.set(day, nextAppends);
          appendTodayReflection(day, targetId, reflectionText);
          renderHistoryTimeline(day, false);
        });

      function renderHistoryTimeline(day, isFuture) {
        historyTimeline.replaceChildren();
        if (isFuture) {
          const empty = document.createElement(&quot;div&quot;);
          empty.className = &quot;cn-history-empty&quot;;
          empty.textContent = &quot;未来尚未发生，这里还没有记录。&quot;;
          historyTimeline.appendChild(empty);
          return;
        }

        const events = dayEvents[day] || [];
        const photos = dayPhotoCounts[day] || 0;
        const appends = historyAppends.get(day) || [];
        if (photos &gt; 0) {
          appendHistoryEntry({
            day,
            targetId: &quot;photos&quot;,
            time: &quot;14:30&quot;,
            kind: &quot;照片&quot;,
            text:
              photos === 1
                ? &quot;这一天留下了一张照片。&quot;
                : `这一天留下了 ${photos} 张照片，按时间归入当天记录。`,
            tags: [&quot;#生活&quot;],
            photoCount: brokenPhotoDays.has(day) ? 0 : photos,
            broken: brokenPhotoDays.has(day),
          });
        }
        if (events.length &gt; 0) {
          appendHistoryEntry({
            day,
            targetId: &quot;events&quot;,
            time: &quot;09:20&quot;,
            kind: &quot;回顾&quot;,
            text: `${events.length} 项计划在这一天留下了执行记录。`,

        if (!photos &amp;&amp; !events.length &amp;&amp; !appends.length) {
          const empty = document.createElement(&quot;div&quot;);
          empty.className = &quot;cn-history-empty&quot;;

          historyTimeline.appendChild(empty);
        }

      }

      function renderHistoryCheckins(day, isFuture) {
        historyCheckins.replaceChildren();
        historyCheckins.hidden = isFuture;
        if (isFuture) return;

        const total = historyCheckinTemplates.length;
        const completed = Math.min(historyCheckinCounts[day] ?? total, total);
        const card = document.createElement(&quot;section&quot;);
        card.className = &quot;cn-history-checkin-card&quot;;
        card.dataset.historyCheckins = String(day);
        card.setAttribute(
          &quot;aria-label&quot;,
          `11 月 ${day} 日打卡，完成 ${completed} 项，共 ${total} 项`
        );
        card.style.setProperty(
          &quot;--cn-history-progress&quot;,
          `${total ? Math.round((completed / total) * 100) : 0}%`
        );

        const head = document.createElement(&quot;div&quot;);
        head.className = &quot;cn-history-checkin-head&quot;;
        const title = document.createElement(&quot;strong&quot;);
        title.textContent = &quot;当日打卡&quot;;
        const count = document.createElement(&quot;span&quot;);
        count.className = &quot;cn-history-checkin-count&quot;;
        count.textContent = `${completed} / ${total} 已完成`;
        head.append(title, count);

        const progress = document.createElement(&quot;div&quot;);
        progress.className = &quot;cn-history-checkin-progress&quot;;
        progress.setAttribute(&quot;role&quot;, &quot;progressbar&quot;);
        progress.setAttribute(&quot;aria-label&quot;, &quot;当日打卡完成度&quot;);
        progress.setAttribute(&quot;aria-valuemin&quot;, &quot;0&quot;);
        progress.setAttribute(&quot;aria-valuemax&quot;, String(total));
        progress.setAttribute(&quot;aria-valuenow&quot;, String(completed));
        const fill = document.createElement(&quot;span&quot;);
        progress.appendChild(fill);
        card.append(head, progress);

        if (completed === 0 &amp;&amp; day === 8) {
          const empty = document.createElement(&quot;div&quot;);
          empty.className = &quot;cn-history-checkin-empty&quot;;
          empty.textContent = &quot;这一天没有留下打卡记录。&quot;;
          card.appendChild(empty);
        } else {
          const list = document.createElement(&quot;div&quot;);
          list.className = &quot;cn-history-checkin-list&quot;;
          list.setAttribute(&quot;role&quot;, &quot;list&quot;);
          historyCheckinTemplates.forEach((template, index) =&gt; {
            const done = index &lt; completed;
            const row = document.createElement(&quot;div&quot;);
            row.className = &quot;cn-history-checkin-row&quot;;
            row.classList.toggle(&quot;is-done&quot;, done);
            row.setAttribute(&quot;role&quot;, &quot;listitem&quot;);
            row.setAttribute(
              &quot;aria-label&quot;,
              `${template.title}，${done ? &quot;已完成&quot; : &quot;未完成&quot;}`
            );

            const mark = document.createElement(&quot;span&quot;);
            mark.className = &quot;cn-history-checkin-mark&quot;;
            mark.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
            if (done) {
              const check = document.createElement(&quot;i&quot;);
              check.dataset.lucide = &quot;check&quot;;
              mark.appendChild(check);
            }

            const copy = document.createElement(&quot;span&quot;);
            copy.className = &quot;cn-history-checkin-copy&quot;;
            const itemTitle = document.createElement(&quot;span&quot;);
            itemTitle.className = &quot;cn-history-checkin-title&quot;;
            itemTitle.textContent = template.title;
            const path = document.createElement(&quot;span&quot;);
            path.className = &quot;cn-history-checkin-path&quot;;
            path.textContent = `${template.annual} · ${template.path}`;
            copy.append(itemTitle, path);

            const state = document.createElement(&quot;span&quot;);
            state.className = &quot;cn-history-checkin-state&quot;;
            state.textContent = done ? &quot;完成&quot; : &quot;未完成&quot;;
            row.append(mark, copy, state);
            list.appendChild(row);
          });
          card.appendChild(list);
        }

        historyCheckins.appendChild(card);
        globalThis.lucide?.createIcons({ attrs: { width: 11, height: 11 } });
      }

      function positionComposer(day, shouldFocus = false) {
        inlineComposer.hidden = false;
        const mondayOffset = (new Date(2026, 10, 1).getDay() + 6) % 7;
        const rowEndDay = Math.ceil((mondayOffset + day) / 7) * 7 - mondayOffset;
        const nextDay = calendarGrid.querySelector(`[data-day=&quot;${rowEndDay + 1}&quot;]`);
        if (nextDay) {
          calendarGrid.insertBefore(inlineComposer, nextDay);
        } else {
          calendarGrid.appendChild(inlineComposer);
        }
        composeDate.textContent = [
          day === 11 ? &quot;今天&quot; : &quot;&quot;,
          formatDate(day),
          formatLunarDate(new Date(2026, 10, day, 12)),
        ]
          .filter(Boolean)
          .join(&quot; · &quot;);
        const editable = day === 11;
        const isFuture = day &gt; 11;
        inlineComposer.classList.toggle(&quot;is-readonly&quot;, !editable);
        readonlyBadge.hidden = false;
        readonlyBadge.textContent = editable ? &quot;当下&quot; : isFuture ? &quot;未来&quot; : &quot;曾经&quot;;
        readonlyBadge.classList.toggle(&quot;is-future&quot;, isFuture);
        readonlyBadge.classList.toggle(&quot;is-current&quot;, editable);
        quickCheckins.hidden = !editable;
        journalPrompts.hidden = !editable;
        composeField.hidden = !editable;
        if (!editable) {
          setBookActionVisible(false);
          setTagPickerVisible(false);
        }
        captureText.hidden = !editable;
        inlineFooter.hidden = !editable;
        historySummary.hidden = editable;
        historyActions.hidden = editable || isFuture;
        sharePreview.hidden = true;
        latestMemo.hidden = !editable || latestMemo.dataset.hasContent !== &quot;true&quot;;
        timelineSection.hidden = !editable;

        if (!editable) {
          const events = dayEvents[day] || [];
          const photos = dayPhotoCounts[day] || 0;
          const complete = completedDays.has(day);
          historyPoem.textContent = isFuture
            ? &quot;来日未至，风还在路上。&quot;
            : &quot;旧日已远，仍有微光可拾。&quot;;
          renderHistoryCheckins(day, isFuture);
          renderHistoryTimeline(day, isFuture);
          historyMeta.replaceChildren();
          const metaItems = isFuture
            ? [`${events.length} 项计划`, &quot;不可填写&quot;]
            : [`${events.length} 项安排`, `${photos} 张图片`, complete ? &quot;已完成&quot; : &quot;未完成&quot;];
          metaItems.forEach((text) =&gt; {
              const item = document.createElement(&quot;span&quot;);
              item.textContent = text;
              historyMeta.appendChild(item);
          });
        }

        if (shouldFocus &amp;&amp; editable) {
          window.setTimeout(() =&gt; captureText.focus(), 0);
        }
      }

      function selectDay(day, shouldFocus = true) {
        selectedDay = day;
        calendarGrid.querySelectorAll(&quot;[data-day]&quot;).forEach((button) =&gt; {
          const active = Number(button.dataset.day) === day;
          button.classList.toggle(&quot;is-selected&quot;, active);
          button.setAttribute(&quot;aria-pressed&quot;, String(active));

        positionComposer(day, shouldFocus);

      function collapseComposer() {
        selectedDay = null;
        calendarGrid.querySelectorAll(&quot;[data-day]&quot;).forEach((button) =&gt; {
          button.classList.remove(&quot;is-selected&quot;);

      buildCalendar();

      }, 0);
      positionComposer(11);
      calendarGrid.addEventListener(&quot;click&quot;, (event) =&gt; {
        const day = event.target.closest(&quot;[data-day]&quot;);
        if (!day) return;
        const nextDay = Number(day.dataset.day);
        if (nextDay &lt; 11 &amp;&amp; nextDay === selectedDay) {
          collapseComposer();
          return;
        }
        selectDay(nextDay);
      });

      let swipeState = null;
      let swipeCommitTimer = null;

      function resetSwipeVisual(transition = &quot;none&quot;) {
        inlineComposer.style.transition = transition;
        inlineComposer.style.transform = &quot;translateX(0)&quot;;
        inlineComposer.style.opacity = &quot;1&quot;;
      }

      inlineComposer.addEventListener(&quot;pointerdown&quot;, (event) =&gt; {
        if (event.pointerType === &quot;mouse&quot; || event.button !== 0) return;
        if (event.target.closest(&quot;button, input, select&quot;)) return;
        swipeState = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          horizontal: false,
        };
      });

      inlineComposer.addEventListener(&quot;pointermove&quot;, (event) =&gt; {
        if (!swipeState || swipeState.pointerId !== event.pointerId) return;
        const dx = event.clientX - swipeState.startX;
        const dy = event.clientY - swipeState.startY;
        if (Math.abs(dx) &lt; 8 || Math.abs(dx) &lt; Math.abs(dy) * 1.15) return;
        swipeState.horizontal = true;
        const damped = Math.max(-34, Math.min(34, dx * 0.24));
        inlineComposer.style.transition = &quot;none&quot;;
        inlineComposer.style.transform = `translateX(${damped}px)`;
        inlineComposer.style.opacity = String(1 - Math.min(Math.abs(dx) / 520, 0.1));
      });

      inlineComposer.addEventListener(&quot;pointerup&quot;, (event) =&gt; {
        if (!swipeState || swipeState.pointerId !== event.pointerId) return;
        const dx = event.clientX - swipeState.startX;
        const shouldSwitch = swipeState.horizontal &amp;&amp; Math.abs(dx) &gt;= 52;
        const direction = dx &lt; 0 ? &quot;next&quot; : &quot;prev&quot;;
        swipeState = null;
        window.clearTimeout(swipeCommitTimer);

        if (!shouldSwitch) {
          resetSwipeVisual(&quot;transform 180ms ease, opacity 180ms ease&quot;);
          return;
        }

        const nextDay = Math.max(1, Math.min(30, selectedDay + (direction === &quot;next&quot; ? 1 : -1)));
        if (nextDay === selectedDay) {
          resetSwipeVisual(&quot;transform 180ms ease, opacity 180ms ease&quot;);
          return;
        }

        inlineComposer.style.transition = &quot;transform 120ms ease, opacity 120ms ease&quot;;
        inlineComposer.style.transform = `translateX(${direction === &quot;next&quot; ? -24 : 24}px)`;
        inlineComposer.style.opacity = &quot;0.45&quot;;
        swipeCommitTimer = window.setTimeout(() =&gt; {
          selectDay(nextDay, false);
          resetSwipeVisual();
          requestAnimationFrame(() =&gt; {
            inlineComposer.classList.add(`is-entering-${direction}`);
            window.setTimeout(() =&gt; {
              inlineComposer.classList.remove(`is-entering-${direction}`);
            }, 250);
          });
        }, 120);
      });

      inlineComposer.addEventListener(&quot;pointercancel&quot;, () =&gt; {
        swipeState = null;
        resetSwipeVisual();
      });

      root.querySelector(&quot;[data-share-history]&quot;).addEventListener(&quot;click&quot;, () =&gt; {

          latestAppend?.text ||

              ? &quot;这一天的努力，在很久以后仍然有回声。&quot;
              : &quot;有些日子不必热闹，也值得被记住。&quot;);

      root.querySelector(&quot;[data-close-share]&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        sharePreview.hidden = true;

      function insertExistingTag(tag) {
        const token = `#${tag}`;
        const escaped = token.replace(/[.*+?^${}()|[\]\\]/g, &quot;\\$&amp;&quot;);
        const alreadyExists = new RegExp(`(^|\\s)${escaped}(?=\\s|$)`).test(
          captureText.value
        );
        if (!alreadyExists) {
          const start = captureText.selectionStart ?? captureText.value.length;
          const end = captureText.selectionEnd ?? start;
          captureText.setRangeText(`${token} `, start, end, &quot;end&quot;);
          captureText.dispatchEvent(new Event(&quot;input&quot;, { bubbles: true }));
        }
        captureText.focus();
        captureText.setSelectionRange(captureText.value.length, captureText.value.length);
      }

      root.querySelector(&quot;[data-save-book-action]&quot;).addEventListener(&quot;click&quot;, () =&gt; {

      composeImageButton.addEventListener(&quot;click&quot;, () =&gt; composeImageInput.click());
      composeImageInput.addEventListener(&quot;change&quot;, () =&gt; {
        const files = [...composeImageInput.files].slice(0, 3);

        clearComposeImages();
        files.forEach((file) =&gt; {
          const preview = document.createElement(&quot;span&quot;);
          preview.className = &quot;cn-inline-image&quot;;
          const image = document.createElement(&quot;img&quot;);
          const url = URL.createObjectURL(file);
          composePreviewUrls.push(url);
          image.src = url;
          image.alt = file.name;
          const remove = document.createElement(&quot;button&quot;);
          remove.type = &quot;button&quot;;
          remove.className = &quot;cn-inline-image-remove&quot;;
          remove.setAttribute(&quot;aria-label&quot;, `移除图片 ${file.name}`);
          const icon = document.createElement(&quot;i&quot;);
          icon.dataset.lucide = &quot;x&quot;;
          icon.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
          remove.appendChild(icon);
          remove.addEventListener(&quot;click&quot;, () =&gt; {
            const index = composePreviewUrls.indexOf(url);
            if (index &gt;= 0) composePreviewUrls.splice(index, 1);
            URL.revokeObjectURL(url);
            preview.remove();
            composeImages.hidden = !composeImages.querySelector(&quot;.cn-inline-image&quot;);

          });
          preview.append(image, remove);
          composeImages.appendChild(preview);

        composeImageInput.value = &quot;&quot;;

      insertTagButton.addEventListener(&quot;click&quot;, () =&gt; {

          button.setAttribute(&quot;aria-pressed&quot;, String(!pressed));
          button.classList.toggle(&quot;is-active&quot;, !pressed);

      publishButton.addEventListener(&quot;click&quot;, () =&gt; {

        if (!text &amp;&amp; !imageCount) return;

          text || (imageCount ? `${imageCount} 张图片已收进今天` : &quot;&quot;);
        latestTime.textContent = new Intl.DateTimeFormat(&quot;zh-CN&quot;, {
          hour: &quot;2-digit&quot;,
          minute: &quot;2-digit&quot;,

        latestTarget.textContent =
          selectedDay === 11 ? &quot;已写入今天的 Daily&quot; : `已写入 11 月 ${selectedDay} 日的 Daily`;
        latestMemo.dataset.hasContent = &quot;true&quot;;
        latestMemo.hidden = false;
        captureText.value = &quot;&quot;;
        captureText.style.height = &quot;&quot;;
        setBookActionVisible(false);
        setTagPickerVisible(false);
        bookTitle.value = &quot;&quot;;
        bookAuthor.value = &quot;&quot;;
        bookStatus.value = &quot;reading&quot;;
        bookActionStatus.textContent = &quot;选择“读完”后才会推进目标进度&quot;;
        clearComposeImages();
        composeImageInput.value = &quot;&quot;;
        updateComposeAvailability();
